<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McCurdy Family Recipe Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .recipe-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .recipe-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-orange-50">
    <div class="max-w-6xl mx-auto">
        <header class="bg-gradient-to-r from-orange-500 to-red-500 text-white py-8">
            <div class="max-w-6xl mx-auto px-6 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="text-5xl">🍳</div>
                    <div>
                        <h1 class="text-4xl font-bold tracking-tight">McCurdy Family</h1>
                        <p class="text-orange-100 text-xl">Recipe Vault</p>
                    </div>
                </div>
                <a href="https://github.com/wdmccurdy/family-recipes" target="_blank" rel="noopener" class="inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-2xl text-sm font-medium transition-colors">
                    <i class="fab fa-github"></i> View on GitHub
                </a>
            </div>
        </header>

        <div class="px-6 py-12">
            <div class="text-center mb-12">
                <h2 class="text-5xl font-bold text-gray-800 mb-3">Our Family Dinner Adventures</h2>
                <p class="text-xl text-gray-600 max-w-lg mx-auto">Add a markdown file in <code class="text-orange-700 bg-orange-100 px-2 py-0.5 rounded">recipes/</code> and it shows up here automatically.</p>
            </div>

            <div id="recipes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <p class="col-span-full text-center text-gray-500 py-12">Loading recipes…</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { getEmoji, loadManifest, recipePageUrl } from './js/site.js';

        async function loadRecipes() {
            const grid = document.getElementById('recipes-grid');

            try {
                const recipes = await loadManifest();
                grid.innerHTML = '';

                if (recipes.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <p class="text-2xl text-gray-400">No recipes yet</p>
                            <p class="text-gray-500 mt-2">Add a <code>.md</code> file in the <code>recipes/</code> folder.</p>
                        </div>`;
                    return;
                }

                for (const recipe of recipes) {
                    const card = document.createElement('a');
                    card.href = recipePageUrl(recipe.slug);
                    card.className = 'recipe-card block bg-white rounded-3xl shadow-lg overflow-hidden border border-orange-100 hover:border-orange-300';

                    card.innerHTML = `
                        <div class="h-48 bg-gradient-to-br from-orange-100 to-amber-100 flex items-center justify-center text-7xl">
                            ${getEmoji(recipe.slug)}
                        </div>
                        <div class="p-6">
                            <h3 class="font-semibold text-2xl text-gray-800 mb-1">${recipe.title}</h3>
                            <p class="text-orange-600 text-sm font-medium capitalize">${recipe.country} night</p>
                            <div class="mt-6 flex items-center gap-2 text-xs text-gray-500">
                                <i class="fas fa-book-open"></i>
                                <span>View recipe</span>
                            </div>
                        </div>`;
                    grid.appendChild(card);
                }
            } catch (e) {
                console.error(e);
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        Could not load recipes.<br>
                        <span class="text-gray-600 text-sm mt-2 block">If you just added a recipe, push to GitHub and wait a minute for the index to update.</span>
                    </div>`;
            }
        }

        loadRecipes();
    </script>
</body>
</html>
