name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'recipes/*.md'
      - 'scripts/**'
      - 'index.template.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Build recipe pages from markdown'
          file_pattern: |
            index.html
            recipes/manifest.json
            */index.html
